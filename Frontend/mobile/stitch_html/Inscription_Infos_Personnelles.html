<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                    },

<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        
        /* Premium subtle gradient background */
        body {
            background: radial-gradient(circle at 50% -20%, var(--tw-colors-secondary-container) 0%, var(--tw-colors-background) 50%);
            background-attachment: fixed;
        }
        
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- Header Area -->
<header class="pt-safe flex flex-col w-full px-container_margin z-50">
<div class="flex items-center justify-between py-4 w-full">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-highest hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface group-hover:scale-90 transition-transform" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Inscription</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
<!-- Progress Stepper -->
<div class="flex items-center justify-center gap-2 mt-2 w-full max-w-[200px] mx-auto">
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-container"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary-container relative overflow-hidden">
<div class="absolute inset-0 bg-white/30 animate-pulse"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container_margin pt-8 pb-4 w-full max-w-md mx-auto">
<!-- Typography Header -->
<div class="mb-8">
<h2 class="font-h1 text-h1 text-primary mb-2">Informations Personnelles</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Complétez votre profil pour finaliser votre inscription.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-stack_lg flex-1">
<!-- Input 1: Nom complet -->
<div class="flex flex-col gap-stack_sm group">
<label class="font-label-md text-label-md text-on-surface-variant ml-2" for="nom">Nom complet</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-[24px] border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all px-4 py-3 shadow-[0_4px_20px_rgba(79,70,229,0.02)]">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary-container mr-3 transition-colors" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="bg-transparent border-none p-0 focus:ring-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="nom" placeholder="Saisissez votre nom" type="text"/>
</div>
</div>
<!-- Input 2: Adresse e-mail -->
<div class="flex flex-col gap-stack_sm group">
<label class="font-label-md text-label-md text-on-surface-variant ml-2" for="email">Adresse e-mail</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-[24px] border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all px-4 py-3 shadow-[0_4px_20px_rgba(79,70,229,0.02)]">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary-container mr-3 transition-colors" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="bg-transparent border-none p-0 focus:ring-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="email" placeholder="votre@email.com" type="email"/>
</div>
</div>
<!-- Input 3: Adresse -->
<div class="flex flex-col gap-stack_sm group">
<label class="font-label-md text-label-md text-on-surface-variant ml-2" for="adresse">Adresse</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-[24px] border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all px-4 py-3 shadow-[0_4px_20px_rgba(79,70,229,0.02)]">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary-container mr-3 transition-colors" style="font-variation-settings: 'FILL' 0;">location_on</span>
<input class="bg-transparent border-none p-0 focus:ring-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="adresse" placeholder="Votre adresse postale" type="text"/>
</div>
</div>
</form>
<!-- Bottom Action Area -->
<div class="mt-auto pt-8 pb-safe w-full">
<button class="w-full flex items-center justify-center bg-primary-container text-on-primary-container rounded-[24px] py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(103,80,164,0.15)] hover:bg-surface-tint hover:text-white active:scale-[0.98] transition-all duration-200">
                Terminer l'inscription
            </button>
</div>
</main>
</body></html>
