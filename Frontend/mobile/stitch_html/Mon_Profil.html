<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .premium-gradient {
            background: linear-gradient(135deg, #4f378a 0%, #6750a4 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#594400",
                      "tertiary-fixed": "#ffdf93",
                      "error": "#ba1a1a",
                      "surface-dim": "#ded8e0",
                      "primary-fixed": "#e9ddff",
                      "background": "#fdf7ff",
                      "on-secondary-fixed-variant": "#4b4263",
                      "surface-container-low": "#f8f2fa",
                      "inverse-on-surface": "#f5eff7",
                      "surface-bright": "#fdf7ff",
                      "primary-container": "#6750a4",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#503d00",
                      "on-secondary-container": "#645a7d",
                      "secondary": "#63597c",
                      "surface-variant": "#e6e0e9",
                      "on-primary-fixed-variant": "#4f378a",
                      "tertiary-container": "#c9a74d",
                      "on-secondary-fixed": "#1f1635",
                      "on-primary": "#ffffff",
                      "surface-tint": "#6750a4",
                      "on-primary-fixed": "#22005d",
                      "surface": "#fdf7ff",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e6e0e9",
                      "on-error": "#ffffff",
                      "on-primary-container": "#e0d2ff",
                      "primary-fixed-dim": "#cfbcff",
                      "on-surface-variant": "#494551",
                      "on-background": "#1d1b20",
                      "secondary-container": "#e1d4fd",
                      "tertiary": "#765b00",
                      "inverse-surface": "#322f35",
                      "on-tertiary-fixed": "#241a00",
                      "outline-variant": "#cbc4d2",
                      "primary": "#4f378a",
                      "outline": "#7a7582",
                      "inverse-primary": "#cfbcff",
                      "secondary-fixed-dim": "#cdc0e9",
                      "on-error-container": "#93000a",
                      "on-secondary": "#ffffff",
                      "on-surface": "#1d1b20",
                      "secondary-fixed": "#e9ddff",
                      "tertiary-fixed-dim": "#e7c365",
                      "surface-container-high": "#ece6ee",
                      "surface-container": "#f2ecf4",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "card_padding": "24px",
                      "section_gap": "16px",
                      "stack_sm": "8px",
                      "container_margin": "20px",
                      "stack_lg": "24px",
                      "stack_md": "16px"
              },
              "fontFamily": {
                      "h2": ["Inter"],
                      "label-md": ["Inter"],
                      "h3": ["Inter"],
                      "h1": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "h3": ["20px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
                      "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-xl border-b border-white/20 dark:border-white/10 shadow-[0_4px_20px_rgba(79,70,229,0.08)] docked full-width top-0 sticky flex justify-between items-center px-container_margin py-4 w-full z-50">
<button class="hover:bg-primary/5 transition-colors p-2 rounded-full flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-primary">Mon Profil</h1>
<button class="hover:bg-primary/5 transition-colors p-2 rounded-full flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">logout</span>
</button>
</header>
<main class="flex-grow px-container_margin py-stack_lg space-y-stack_lg pb-32">
<!-- Profile Header Section -->
<section class="flex flex-col items-center">
<div class="relative group">
<div class="w-32 h-32 rounded-full border-4 border-white shadow-xl overflow-hidden mb-4">
<img alt="Avatar de Jean Dupont" class="w-full h-full object-cover" data-alt="A professional, high-end portrait of a refined man in his 40s with a warm and confident expression. He is wearing a tailored navy blazer against a softly blurred minimalist architectural background with bright, natural lighting. The overall aesthetic is clean, luxurious, and modern, echoing a premium financial corporate environment with soft cool tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuByBFEbfkZTYq-n7bt2LuPOx4wFE7Z8gAIwS1ysIOKKaaUuk7QfUC3fH0cEY0grrzf2Ib9-4vHI7W5n3DC8P8Nsa80GZz0t6obY0rlh7DNM87iiiQa6c2g5bmCq-Adw1NOWOMoTQ5CSUOzgiKeuJUTzeC6hWVMq4NfgHzJuIxb-NgW15Ayq5V3LRAGzn5XVe9-ivcudLisk3GWP6apH_J3fhS40ku4iSObEu3yasmnGbNUwteg-WqqjUJiEPJ0F3sCtCqyGRMFFrTI"/>
</div>
<button class="absolute bottom-4 right-0 premium-gradient text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-2 border-white active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<div class="text-center">
<h2 class="font-h2 text-h2 text-on-background">Jean Dupont</h2>
<p class="font-body-md text-on-surface-variant">Espace Titulaire</p>
</div>
</section>
<!-- Profile Details Section -->
<section class="space-y-stack_sm">
<h3 class="font-label-sm text-label-sm uppercase text-outline px-2">Informations personnelles</h3>
<div class="bg-surface-container-lowest glass-card rounded-[24px] p-stack_md shadow-sm divide-y divide-outline-variant/30">
<div class="py-3 flex justify-between items-center">
<div>
<p class="font-label-sm text-label-sm text-outline">Email</p>
<p class="font-body-md text-on-surface">jean.dupont@email.com</p>
</div>
</div>
<div class="py-3 flex justify-between items-center">
<div>
<p class="font-label-sm text-label-sm text-outline">Téléphone</p>
<p class="font-body-md text-on-surface">+33 6 12 34 56 78</p>
</div>
</div>
<div class="py-3 flex justify-between items-center">
<div>
<p class="font-label-sm text-label-sm text-outline">Adresse</p>
<p class="font-body-md text-on-surface">123 Rue de la Paix, Paris</p>
</div>
</div>
</div>
</section>
<!-- Security Section -->
<section class="space-y-stack_sm">
<h3 class="font-label-sm text-label-sm uppercase text-outline px-2">Sécurité</h3>
<div class="space-y-stack_sm">
<!-- Change PIN Button -->
<button class="w-full bg-surface-container-lowest glass-card rounded-[24px] p-stack_md shadow-sm flex items-center gap-4 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">lock</span>
</div>
<div class="flex-grow text-left">
<p class="font-body-md text-on-surface font-semibold">Changer mon code PIN</p>
<p class="font-label-sm text-label-sm text-outline">Modifiez votre accès sécurisé</p>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Biometric Toggle -->
</div>
</section>
<!-- Danger Zone / Actions -->
<section class="space-y-stack_sm pt-4">
<button class="w-full flex items-center justify-center gap-3 font-h3 text-h3 py-4 text-primary bg-primary/5 rounded-[24px] border border-primary/20 active:scale-95 transition-all">
<span class="material-symbols-outlined">swap_horiz</span>
                Changer d'espace
            </button>
<button class="w-full flex items-center justify-center gap-3 font-h3 text-h3 py-4 text-error bg-error-container/20 rounded-[24px] border border-error/10 active:scale-95 transition-all">
<span class="material-symbols-outlined">logout</span>
                Déconnexion
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-xl border-t border-white/20 dark:border-white/10 shadow-[0_-4px_20px_rgba(79,70,229,0.05)] docked full-width bottom-0 rounded-t-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe">
<div class="flex flex-col items-center justify-center text-on-secondary-container dark:text-secondary-fixed-dim p-2 hover:bg-surface-variant transition-all scale-110 active:scale-95">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Accueil</span>
</div>
<div class="flex flex-col items-center justify-center text-on-secondary-container dark:text-secondary-fixed-dim p-2 hover:bg-surface-variant transition-all scale-110 active:scale-95">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-sm text-label-sm">Chèques</span>
</div>
<div class="flex flex-col items-center justify-center text-on-secondary-container dark:text-secondary-fixed-dim p-2 hover:bg-surface-variant transition-all scale-110 active:scale-95">
<span class="material-symbols-outlined">photo_camera</span>
<span class="font-label-sm text-label-sm">Scanner</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl p-2 hover:bg-surface-variant transition-all scale-110 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Paramètres</span>
</div>
</nav>
</body></html>
