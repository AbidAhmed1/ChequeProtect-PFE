<body class="bg-mesh min-h-screen flex flex-col font-body-md text-on-background">
<!-- Header Suppression: This is a Transactional/Onboarding page, no global nav -->
<header class="w-full py-8 px-container_margin flex justify-center lg:justify-start">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-h2 text-h2 font-bold text-primary tracking-tight">ChequePro</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-container_margin pb-12">
<div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
<!-- Left Side: Visual Illustration (Premium Branding) -->
<div class="hidden lg:block relative group">
<div class="absolute -inset-4 bg-primary/5 rounded-card blur-2xl group-hover:bg-primary/10 transition-all duration-500"></div>
<div class="relative rounded-card overflow-hidden glass-panel aspect-square flex items-center justify-center p-8">
<img alt="Financial Premium Illustration" class="w-full h-full object-cover rounded-xl shadow-lg" data-alt="A macro close-up of a high-end titanium credit card and a stack of crisp checks resting on a polished marble surface. The lighting is sophisticated and soft, emphasizing metallic textures and premium paper quality. The atmosphere is professional and secure, using a palette of deep indigo and soft lavenders to match a luxurious financial application aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEcJ-V8q4PAhofMvWI5r7da8RJimEaPXPVhxRkINtsNMnhoKJySkaOXlGzIeA0gacBIsSeikVSs4Iz0_uuiu1-n-EHCVshozDCE8OB6JuPW9m93en79PhjWFqj-mK8axlGMS_QeDJmK-i0IGqKTqGWmlTelUav1kkrUjkU727-Izl_SRT2PoZyXyOPjgf4z8ojUln9iQCpf671X7vJdvPhDoMWaDzYrN1Ak1AjuQplddaD1YUp0FYuXzMtgZYsfOBbb59cGdjkbO4"/>
<div class="absolute bottom-12 left-12 right-12 p-6 glass-panel rounded-xl">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary" data-icon="verified">verified</span>
<span class="font-label-md text-label-md text-primary uppercase tracking-wider">Accès Premium</span>
</div>
<p class="font-h3 text-h3 text-on-surface">Sécurité de niveau bancaire pour vos transactions.</p>
</div>
</div>
</div>
<!-- Right Side: Signup Form -->
<div class="w-full max-w-md mx-auto">
<div class="glass-panel p-card_padding rounded-card border border-white/20">
<header class="mb-stack_lg">
<h1 class="font-h1 text-h1 text-on-surface mb-2">Inscription</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Veuillez saisir votre RIB pour commencer</p>
</header>
<form class="space-y-stack_md">
<div class="space-y-stack_sm">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="rib">Numéro de RIB</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="credit_card">credit_card</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="rib" name="rib" placeholder="FR76 3000 1000 0102 0304 0506 078" type="text"/>
</div>
</div>
<div class="pt-2">
<button class="w-full premium-gradient text-white font-h3 text-h3 py-4 rounded-xl shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                                Continuer
                                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack_lg pt-stack_lg border-t border-outline-variant/30 flex flex-col items-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-2 px-4 rounded-full hover:bg-primary/5 active:scale-95 duration-200">
                            Je n'ai pas de RIB (Accès invité)
                        </button>
</div>
</div>
<div class="mt-8 flex items-center justify-center gap-6">
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-label-sm font-label-sm uppercase">AES-256 Chiffré</span>
</div>
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="shield_with_heart" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<span class="text-label-sm font-label-sm uppercase">Conforme RGPD</span>
</div>
</div>
</div>
</div>
