<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                extend: {
                    "colors": {

                        "surface-tint": "#6750a4",
                        "primary-fixed": "#e9ddff",
                        "secondary-fixed": "#e9ddff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#4b4263",
                        "tertiary-fixed": "#ffdf93",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container": "#f2ecf4",
                        "on-secondary": "#ffffff",
                        "primary": "#4f378a",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f5eff7",
                        "secondary": "#63597c",
                        "on-primary-container": "#e0d2ff",
                        "surface-bright": "#fdf7ff",
                        "primary-container": "#6750a4",
                        "secondary-container": "#e1d4fd",
                        "outline": "#7a7582",
                        "on-background": "#1d1b20",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#494551",
                        "on-tertiary-container": "#503d00",
                        "on-tertiary-fixed": "#241a00",

                        "secondary-fixed-dim": "#cdc0e9",
                        "inverse-primary": "#cfbcff",

                        "primary-fixed-dim": "#cfbcff",
                        "background": "#fdf7ff",
                        "tertiary": "#765b00",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#e7c365",
                        "on-primary-fixed-variant": "#4f378a",
                        "surface-dim": "#ded8e0",
                        "tertiary-container": "#c9a74d",
                        "surface-container-high": "#ece6ee",
                        "on-primary-fixed": "#22005d",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    },
                    "spacing": {
                        "card_padding": "24px",
                        "container_margin": "20px",
                        "stack_lg": "24px",
                        "stack_sm": "8px",
                        "stack_md": "16px",
                        "section_gap": "16px"
                    },
                    "fontFamily": {
                        "h1": ["Inter"],
                        "label-md": ["Inter"],
                        "h2": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "h3": ["Inter"]
                    },
                    "fontSize": {
                        "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],

                        "h3": ["20px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}]

                }
            }
        }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.08);
        }
        .confetti-overlay {
            background-image: radial-gradient(circle, #6750a4 1px, transparent 1px), radial-gradient(circle, #c9a74d 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.1;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Confetti Background Layer -->
<div class="absolute inset-0 pointer-events-none confetti-overlay"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container_margin py-stack_lg z-10">
<!-- Success Animation/Icon Header -->
<div class="flex flex-col items-center mb-stack_lg">
<div class="w-24 h-24 rounded-full bg-emerald-500/10 flex items-center justify-center mb-stack_md border border-emerald-500/20">
<span class="material-symbols-outlined text-[48px] text-emerald-600" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface text-center">Dépôt réussi !</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Votre transaction a été traitée avec succès.</p>
</div>
<!-- Transaction Details Card -->
<div class="w-full max-w-md glass-card rounded-[24px] p-card_padding space-y-stack_md border border-outline-variant/30">
<div class="flex flex-col items-center border-b border-outline-variant/20 pb-stack_md mb-stack_md">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Montant déposé</span>
<span class="font-h1 text-h1 text-primary">500 €</span>
</div>
<div class="space-y-stack_sm">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">N° de transaction</span>
<span class="font-label-md text-label-md text-on-surface">9823</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Date</span>
<span class="font-label-md text-label-md text-on-surface">04/05/2026</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Statut</span>
<div class="px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 font-label-sm text-label-sm">
                        Confirmé
                    </div>
</div>
</div>
<!-- Receipt Illustration -->
<div class="mt-stack_lg pt-stack_lg border-t border-dashed border-outline-variant/50">
<div class="relative w-full aspect-[4/1] rounded-xl overflow-hidden grayscale opacity-40 mix-blend-multiply">
<img class="w-full h-full object-cover" data-alt="A macro close-up of a high-quality textured paper receipt featuring elegant typography and security watermarks. The lighting is soft and directional, highlighting the crisp lines and premium finish of the document. The overall aesthetic is professional and clean, fitting a luxury banking application with a light-mode color palette of soft whites and cool greys." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZ6gxcwFK1yF-KJVo4y1jr_m9W5zcEybDE6ehVu6U7tLfwxvxTzt6Itf1l09y-AhzSGNQxE_q-Wyr57-zbYcvFjuHeTaVPYVvSwYBPiFNHTWCliFzOxpg9lZiGCpiC-WoLwdsEVzLYWUwR4io8dkGRC8GpFZnce93Lm7Bnd5ypLc77DEqbQ-uRCP3-_8nDX9mS6s3-sjgal2qqcCMjMXd7HK1C9V7o7XmB4YYbdYR10EcB4cwTvlF2cA7PpLeaFtSMKADFxdOUJPA"/>
</div>
</div>
</div>
<!-- Secondary Info -->
<p class="mt-stack_lg text-center font-label-md text-label-md text-on-surface-variant max-w-xs">
            Un e-mail de confirmation a été envoyé à votre adresse enregistrée.
        </p>
</main>
<!-- Bottom Actions Area -->
<footer class="w-full px-container_margin pb-12 pt-stack_lg flex flex-col items-center z-10">
<button class="w-full max-w-md h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-h3 text-h3 rounded-xl flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-200">
            Retour à l'accueil
        </button>
<button class="mt-stack_md text-primary font-label-md text-label-md hover:underline transition-all">
            Télécharger le reçu (PDF)
        </button>
</footer>
<!-- Decorative Elements (Glass Orbs) -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-80 h-80 bg-tertiary/10 rounded-full blur-[100px] pointer-events-none"></div>
</body></html>
