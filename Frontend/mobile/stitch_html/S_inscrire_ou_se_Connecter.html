<!DOCTYPE html>

<style>
        body {
            background-color: #fdf7ff;
            font-family: 'Inter', sans-serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #4f378a 0%, #6750a4 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col justify-between items-center bg-background p-container_margin">
<!-- Top Branding Section -->
<header class="w-full max-w-md pt-12 flex flex-col items-center text-center space-y-stack_lg">
<div class="w-20 h-20 rounded-2xl primary-gradient flex items-center justify-center shadow-[0_8px_30px_rgb(79,55,138,0.25)]">
<span class="material-symbols-outlined text-white text-[48px]" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="space-y-stack_sm">
<h1 class="font-h1 text-h1 text-primary tracking-tight">ChèqueProtect</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">Bienvenue sur ChequePro</p>
</div>
</header>
<!-- Main Visual / Bento Background Element -->
<main class="w-full max-w-md flex-grow flex items-center justify-center relative py-section_gap">
<div class="absolute inset-0 z-0 overflow-hidden opacity-20 pointer-events-none">
<div class="absolute -top-10 -left-10 w-64 h-64 bg-primary-container rounded-full blur-3xl"></div>
<div class="absolute -bottom-10 -right-10 w-64 h-64 bg-secondary-container rounded-full blur-3xl"></div>
</div>
<div class="relative z-10 w-full glass-effect rounded-2xl p-card_padding shadow-[0_4px_20px_rgba(79,70,229,0.08)] border border-outline-variant/30 overflow-hidden">
<div class="aspect-video mb-stack_lg rounded-xl overflow-hidden relative border border-white/40">
<img alt="Premium Banking Experience" class="w-full h-full object-cover" data-alt="A sophisticated macro shot of a sleek, premium metallic credit card and handwritten check resting on a polished marble surface. The lighting is soft and cinematic, with cool blue ambient tones reflecting off the metallic edges. The atmosphere communicates elite financial security and modern professionalism, aligning with a high-end luxury banking aesthetic. The composition is clean and minimalist with ample whitespace." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBn8HXq_riMpm6TWHkKJinjApfeefv7dzlR0R7b6V_f-x3SpTeOGKsTrUD76kzb5wfhiSJjpFDXIn39nD7jEYb6qS4pHUO2r-tiFrV6Si09kSwuICyOFImt2Smo5POd_krE__828knvjbWocrK3U_spovt2wL7NjQqNraoAW3bQS5eh02-ySHPbcXucehGC_QI8OcVFwAwPKq7pH-qIG3gYjoR10L74Q2SzoojHdbJRP3-cxXeGDsxl8GfQKnY34y2tMwiEcaf9qlM"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<div class="space-y-stack_md">
<button class="w-full py-4 primary-gradient text-white rounded-xl font-h3 text-h3 shadow-lg active:scale-[0.98] transition-transform duration-200 flex items-center justify-center gap-2">
                    Créer un compte
                </button>
<button class="w-full py-4 bg-white border-2 border-primary text-primary rounded-xl font-h3 text-h3 active:scale-[0.98] transition-all duration-200 hover:bg-primary-fixed/20">
                    Se connecter
                </button>
</div>
<div class="mt-stack_lg flex items-center gap-3 p-3 bg-surface-container-low rounded-lg">
<div class="p-2 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="verified_user">verified_user</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">
                    Sécurité bancaire de niveau premium activée
                </p>
</div>
</div>
</main>
<!-- Footer / Help Section -->
<footer class="w-full max-w-md py-stack_lg text-center">
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-primary hover:underline transition-all" href="#">
            Besoin d'aide ?
            <span class="material-symbols-outlined text-[16px]" data-icon="help_outline">help_outline</span>
</a>
<p class="mt-stack_sm font-label-sm text-label-sm text-outline">
            © 2024 ChequePro SAS. Tous droits réservés.
        </p>
</footer>
